[workspace]
resolver = "3"
members = [
    "crates/vocabulary",
    "crates/player",
    "crates/render",
    "crates/alsa_output",
    "crates/app",
]

[workspace.package]
edition = "2024"
publish = false

# External crate versions live only here (see CLAUDE.md); Cargo.lock holds
# the exact pin. Each crate is on the allow-list in Architecture.md.
[workspace.dependencies]
alsa = "0.12.1"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }

# Release builds normally let integer overflow wrap around silently; keep
# the check so an overflow stops with a report instead (no silent failures).
[profile.release]
overflow-checks = true

# One place for the strict settings; every crate opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# No panics from unwrap/expect outside tests (clippy.toml exempts tests).
unwrap_used = "deny"
expect_used = "deny"
